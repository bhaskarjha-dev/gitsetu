name: Trigger Cloudflare Pages Web Build

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    name: Request deployment from trusted main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send pinned-secret deploy request
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --request POST --header 'Content-Length: 0' --output /dev/null \
            "$CLOUDFLARE_DEPLOY_HOOK_URL"
