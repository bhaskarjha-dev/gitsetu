name: Trigger Cloudflare Pages Web Build

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'gitsetu-web/**'

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Send Cloudflare Deploy Hook
        run: |
          curl -fsSL -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"
          echo "Cloudflare Web Build triggered successfully!"
