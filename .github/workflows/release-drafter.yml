name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    name: Draft release notes from trusted main commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draft from merged main history only
        uses: release-drafter/release-drafter@da8b9b696abad2ad997580e49f4c1c2e03cc2bd2 # v7.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
