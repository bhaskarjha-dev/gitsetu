name: Sigstore Release Signing

on:
  release:
    types: [published]

jobs:
  sign-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for keyless signing via Sigstore

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install sigstore-python
        run: pip install sigstore

      - name: Sign release artifacts with Sigstore
        run: |
          sigstore sign install.sh
          sigstore sign install.ps1

      - name: Upload Sigstore Bundles to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            install.sh.sigstore.json
            install.ps1.sigstore.json
