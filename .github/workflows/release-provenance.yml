name: Verified Release Preparation (No Publish)

# This workflow deliberately has no publication credentials or publish job.
# It produces a detached, signed preparation bundle for a later, separately
# reviewed publish-only workflow. The tagged source remains the sole source
# of release intent; artifact hashes are generated after the build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated candidate tag to prepare (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-preparation-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  policy:
    name: Exact annotated-tag preparation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      commit: ${{ steps.gate.outputs.commit }}
    steps:
      - name: Checkout candidate tag without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Require a clean, exact, non-public candidate tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          version="$(node -p "require('./packaging/release.json').version")"
          test "$tag" = "v$version"
          test "$(git cat-file -t "$tag")" = tag
          commit="$(git rev-parse "$tag^{commit}")"
          test "$(git rev-parse HEAD)" = "$commit"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node packaging/release.js validate-source
          node scripts/check-docs.mjs
          test "$(node -p "require('./packaging/release.json').release.state")" = development
          test "$(node -p "require('./packaging/release.json').release.public")" = false
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build-posix:
    name: Build core POSIX preparation assets
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the commit approved by policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.policy.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Install locked build metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build deterministic POSIX core assets
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          make dist-check
          mkdir -p release-assets
          version="$(node -p "require('./packaging/release.json').version")"
          cp dist/gitsetu release-assets/gitsetu-standalone
          git archive --format=tar --prefix="gitsetu-$version/" HEAD | gzip -n > "release-assets/gitsetu-$version-source.tar.gz"
          npm pack --ignore-scripts --silent > npm-pack-name.txt
          npm_name="$(tail -n 1 npm-pack-name.txt)"
          test "$npm_name" = "gitsetu-$version.tgz"
          mv "$npm_name" "release-assets/gitsetu-$version.tgz"
          rm npm-pack-name.txt
          cp install.sh release-assets/install.sh
          cp packaging/release.env release-assets/release.env
      - name: Upload POSIX preparation inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-prep-posix
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build core Windows preparation assets
    needs: policy
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the commit approved by policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.policy.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Install locked build metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and self-test native launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build_launcher.ps1
          $env:GITSETU_TEST_MODE = '1'
          & .\dist\gitsetu.exe --argv-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build allowlisted Windows ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build_release_zip.ps1
          New-Item -ItemType Directory release-assets -Force | Out-Null
          Copy-Item dist\gitsetu-windows-x64.zip release-assets\gitsetu-windows-x64.zip
          Copy-Item dist\gitsetu.exe release-assets\gitsetu.exe
          Copy-Item install.ps1 release-assets\install.ps1
      - name: Upload Windows preparation inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-prep-windows
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  finalize:
    name: Generate, verify, sign, and attest detached preparation provenance
    needs: [policy, build-posix, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the exact commit approved by policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.policy.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Download exact preparation inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-prep-*
          path: release-assets
          merge-multiple: true
      - name: Generate detached manifest after all bytes exist
        shell: bash
        run: |
          set -euo pipefail
          identity="${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-provenance.yml@${{ github.ref }}"
          node packaging/release-manifest.js create \
            --directory release-assets \
            --output release-assets/release-manifest.json \
            --tag "${{ needs.policy.outputs.tag }}" \
            --source-commit "${{ needs.policy.outputs.commit }}" \
            --tag-commit "${{ needs.policy.outputs.commit }}" \
            --phase core \
            --workflow-run "${{ github.run_id }}" \
            --certificate-identity "$identity" \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node packaging/release-manifest.js verify \
            --manifest release-assets/release-manifest.json \
            --directory release-assets \
            --phase core \
            --tag "${{ needs.policy.outputs.tag }}" \
            --source-commit "${{ needs.policy.outputs.commit }}" \
            --tag-commit "${{ needs.policy.outputs.commit }}"
      - name: Install hash-pinned Cosign 3.1.3
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 \
            -o "$RUNNER_TEMP/cosign"
          printf '%s  %s\n' 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 "$RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"
      - name: Keyless-sign every preparation asset
        run: |
          set -euo pipefail
          for artifact in release-assets/*; do
            case "$artifact" in *.sig|*.sigstore.json|*.pem) continue ;; esac
            "$RUNNER_TEMP/cosign" sign-blob --yes \
              --output-signature "$artifact.sig" \
              --output-certificate "$artifact.pem" \
              --bundle "$artifact.sigstore.json" \
              "$artifact"
          done
          (cd release-assets && sha256sum * > CHECKSUMS.sha256)
      - name: Verify every keyless signature
        shell: bash
        run: |
          set -euo pipefail
          identity="${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-provenance.yml@${{ github.ref }}"
          for artifact in release-assets/*; do
            case "$artifact" in *.sig|*.sigstore.json|*.pem|CHECKSUMS.sha256) continue ;; esac
            "$RUNNER_TEMP/cosign" verify-blob \
              --bundle "$artifact.sigstore.json" \
              --certificate "$artifact.pem" \
              --signature "$artifact.sig" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$artifact"
          done
          (cd release-assets && sha256sum --check CHECKSUMS.sha256)
      - name: Attest all preparation inputs
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-assets/*
      - name: Upload signed preparation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-preparation-${{ needs.policy.outputs.tag }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
