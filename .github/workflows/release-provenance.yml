name: Verified Release Provenance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to rebuild
        required: true
        type: string

permissions:
  contents: read

jobs:
  policy:
    name: Exact tag and release-manifest gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: Checkout exact tag without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Require an intentional public release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node packaging/release.js validate-source
          node scripts/check-docs.mjs
          test "$(node -p "require('./packaging/release.json').release.state")" = released
          expected_tag="v$(node -p "require('./packaging/release.json').version")"
          candidate_tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          test "$candidate_tag" = "$expected_tag"
          test "$(git rev-parse HEAD)" = "$(node -p "require('./packaging/release.json').release.commit")"
          git tag --points-at HEAD | grep -Fx "$expected_tag"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"

  build-posix:
    name: Build source, bundle, npm, installers, and package manifests
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.policy.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Install locked build metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build all POSIX release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          make dist-check
          mkdir -p release-assets package-files
          version="$(node -p "require('./packaging/release.json').version")"
          standalone="$(node -p "require('./packaging/release.json').artifacts.standalone.file")"
          source="$(node -p "require('./packaging/release.json').artifacts.sourceArchive.file")"
          npm_file="$(node -p "require('./packaging/release.json').artifacts.npmPackage.file")"
          posix_installer="$(node -p "require('./packaging/release.json').artifacts.posixInstaller.file")"
          package_manifests="$(node -p "require('./packaging/release.json').artifacts.packageManifests.file")"
          cp dist/gitsetu "release-assets/$standalone"
          git archive --format=tar --prefix="gitsetu-$version/" HEAD | gzip -n > "release-assets/$source"
          npm pack --ignore-scripts --silent > release-assets/npm-pack-name.txt
          npm_name="$(tail -n 1 release-assets/npm-pack-name.txt)"
          test "$npm_name" = "$npm_file"
          mv "$npm_name" "release-assets/$npm_file"
          rm release-assets/npm-pack-name.txt
          cp install.sh "release-assets/$posix_installer"
          cp packaging/release.env release-assets/release.env
          node packaging/release.js render package-files
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "release-assets/$package_manifests" -C package-files .
      - name: Upload exact POSIX inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-posix
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build deterministic Windows launcher and ZIP
    needs: policy
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.policy.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Install locked build metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and self-test native launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build_launcher.ps1
          $env:GITSETU_TEST_MODE = '1'
          & .\dist\gitsetu.exe --argv-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build allowlisted Windows ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build_release_zip.ps1
          $manifest = Get-Content packaging/release.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory release-assets -Force | Out-Null
          Copy-Item dist\gitsetu-windows-x64.zip ("release-assets\" + $manifest.artifacts.windowsZip.file)
          Copy-Item dist\gitsetu.exe ("release-assets\" + $manifest.artifacts.windowsExecutable.file)
          Copy-Item install.ps1 ("release-assets\" + $manifest.artifacts.windowsInstaller.file)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign every exact asset and attest provenance
    needs: [policy, build-posix, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.policy.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: signed-assets
          merge-multiple: true
      - name: Install hash-pinned Cosign 3.1.3
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 \
            -o "$RUNNER_TEMP/cosign"
          printf '%s  %s\n' 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 "$RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"
      - name: Verify exact bytes before signing
        run: |
          node packaging/release.js verify-artifacts signed-assets
          cp signed-assets/$(node -p "require('./packaging/release.json').artifacts.standalone.file") "$RUNNER_TEMP/tampered"
          printf x >> "$RUNNER_TEMP/tampered"
          cp signed-assets/$(node -p "require('./packaging/release.json').artifacts.standalone.file") "$RUNNER_TEMP/original"
          mv "$RUNNER_TEMP/tampered" "signed-assets/$(node -p "require('./packaging/release.json').artifacts.standalone.file")"
          if node packaging/release.js verify-artifacts signed-assets >/dev/null 2>&1; then
            echo "Tampered release bytes were not rejected" >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/original" "signed-assets/$(node -p "require('./packaging/release.json').artifacts.standalone.file")"
          node packaging/release.js verify-artifacts signed-assets
      - name: Keyless-sign every primary asset
        run: |
          set -euo pipefail
          for artifact in signed-assets/*; do
            case "$artifact" in *.sig|*.sigstore.json|*.pem) continue ;; esac
            "$RUNNER_TEMP/cosign" sign-blob --yes \
              --output-signature "$artifact.sig" \
              --output-certificate "$artifact.pem" \
              --bundle "$artifact.sigstore.json" \
              "$artifact"
          done
          (cd signed-assets && sha256sum * > CHECKSUMS.sha256)
      - name: Attest all release inputs
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: signed-assets/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release
          path: signed-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish only after all verification gates
    needs: [policy, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.policy.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-release
          path: release-assets
      - name: Reverify downloaded bytes and checksums
        run: |
          set -euo pipefail
          node packaging/release.js verify-artifacts release-assets
          (cd release-assets && sha256sum --check CHECKSUMS.sha256)
      - name: Publish exact npm tarball with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          npm_file="$(node -p "require('./packaging/release.json').artifacts.npmPackage.file")"
          npm publish "release-assets/$npm_file" --access public --provenance

      - name: Create draft, then publish after upload verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.policy.outputs.tag }}"
          gh release create "$tag" release-assets/* --verify-tag --draft --title "GitSetu $tag" --notes "Verified release generated by the signed provenance workflow."
          gh release view "$tag" --json isDraft --jq '.isDraft' | grep -Fx true
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json isDraft --jq '.isDraft' | grep -Fx false
