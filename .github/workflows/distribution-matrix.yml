name: Distribution Matrix Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux source, bundle, installer, and package policy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Install locked metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce non-public development release policy
        run: |
          node packaging/release.js validate-source
          node scripts/check-docs.mjs
          if node packaging/release.js render "$RUNNER_TEMP/rendered" >/dev/null 2>&1; then
            echo "Development metadata must not render installable manifests" >&2
            exit 1
          fi
      - name: Build and run the actual standalone bundle
        run: |
          make dist-check
          make test-bundle
      - name: Verify trusted POSIX installer/uninstaller paths
        run: |
          bash tests/test_distribution_security.sh
          bash tests/test_posix_installer_e2e.sh
      - name: Verify package templates and aliases without synthetic release claims
        run: |
          bash tests/test_aur.sh
          bash tests/test_nix_flake.sh
          bash tests/test_npm_wrapper.sh
          bash tests/test_gh_extension.sh

  macos:
    name: macOS native Bash 3.2
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Require native Bash 3.2
        run: |
          /bin/bash --version
          /bin/bash -c 'test "${BASH_VERSINFO[0]}" -eq 3 && test "${BASH_VERSINFO[1]}" -eq 2'
      - name: Run native-Bash tests
        run: /bin/bash tests/run_all.sh

  windows:
    name: Windows native launcher, PowerShell, Scoop, and extension
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Install locked metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and self-test trusted native launcher
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build_launcher.ps1
          $env:GITSETU_TEST_MODE = '1'
          & .\dist\gitsetu.exe --argv-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and run the actual standalone bundle
        shell: bash
        run: |
          make dist-check
          make test-bundle
      - name: Install commit-pinned Scoop 0.5.3 test dependency
        run: |
          $ErrorActionPreference = 'Stop'
          # Scoop 0.5.3 resolves its own version through git, so the test
          # dependency has to be a real git checkout at the pinned commit. A
          # hash-verified source archive carries no .git, which makes
          # `scoop --version` abort with "not a git repository" before any
          # package lifecycle test runs. The commit id below is the verified
          # SHA for the v0.5.3 tag and pins the full tree, not a redirectable
          # archive URL.
          $destination = Join-Path $env:RUNNER_TEMP 'scoop-0.5.3'
          & git clone --quiet --depth 1 --branch v0.5.3 https://github.com/ScoopInstaller/Scoop.git $destination
          if ($LASTEXITCODE -ne 0) { throw "Scoop test dependency clone failed: $LASTEXITCODE" }
          $actual = (& git -C $destination rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne 'b588a06e41d920d2123ec70aee682bae14935939') { throw "Scoop test dependency pin mismatch: $actual" }
          $env:SCOOP = $destination
          foreach ($name in @('shims','apps','cache','buckets')) {
            [void][IO.Directory]::CreateDirectory((Join-Path $env:SCOOP $name))
          }
          $scoopAppRoot = Join-Path $env:SCOOP 'apps\scoop\current'
          [void][IO.Directory]::CreateDirectory($scoopAppRoot)
          Copy-Item (Join-Path $env:SCOOP 'supporting') (Join-Path $scoopAppRoot 'supporting') -Recurse
          $env:Path = "$env:SCOOP;$env:Path"
          & "$env:SCOOP\bin\scoop.ps1" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test controlled Scoop package and GitHub extension lifecycle
        run: |
          if (-not $env:SCOOP) { throw 'Pinned Scoop test dependency was not prepared' }
          $env:Path = "$env:SCOOP;$env:Path"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_scoop_e2e.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Command gh.exe -ErrorAction SilentlyContinue)) { throw 'GitHub CLI is required for extension E2E' }
          $env:GH_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'gh-isolated-config'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_gh_extension_e2e.ps1
          exit $LASTEXITCODE
      - name: Run Windows-specific security tests
        run: |
          $errors = $null
          foreach ($file in @('sandbox/launch_sandbox.ps1','sandbox/bootstrap.ps1','tests/test_windows_cli_dispatch.ps1')) {
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
          }
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_windows_cli_dispatch.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_powershell_installer_e2e.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_windows_launcher.ps1
          exit $LASTEXITCODE
