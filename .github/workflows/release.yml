name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Gate (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-latest
            e2e_mode: all
          - os: macos-latest
            label: macos-latest
            e2e_mode: all
          - os: windows-latest
            label: windows-latest (source + bundle)
            e2e_mode: source
          - os: windows-latest
            label: windows-latest (installed + pwsh)
            e2e_mode: installed
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20.19.4'
          cache: npm
          package-manager-cache: false

      - name: Put macOS's own bash, ssh and LibreSSL first on PATH
        if: runner.os == 'macOS'
        run: |
          echo /bin >> "$GITHUB_PATH"
          echo /usr/bin >> "$GITHUB_PATH"

      - name: Check the macOS tools under test
        if: runner.os == 'macOS'
        run: |
          test "$(command -v bash)" = /bin/bash
          bash -c 'test "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2'
          test "$(command -v ssh)" = /usr/bin/ssh
          openssl version | grep '^LibreSSL'
          brew list openssl@3 > /dev/null 2>&1 || brew install openssl@3

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run test suite
        if: runner.os != 'Windows'
        run: make test

      - name: Check standalone bundle
        run: make dist-check

      - name: Run bundle contract suite
        if: matrix.e2e_mode != 'installed'
        run: make test-bundle

      - name: Run cleanroom E2E suite (source mode)
        if: runner.os != 'Windows'
        run: bash tests/e2e_installed.sh --source

      - name: Run cleanroom E2E suite (installed mode)
        if: runner.os != 'Windows'
        run: bash tests/e2e_installed.sh

      - name: Run cleanroom source E2E suite on Windows (Git Bash)
        if: runner.os == 'Windows' && matrix.e2e_mode == 'source'
        shell: bash
        run: bash tests/e2e_installed.sh --source

      - name: Run cleanroom installed E2E suite on Windows (Git Bash)
        if: runner.os == 'Windows' && matrix.e2e_mode == 'installed'
        shell: bash
        run: bash tests/e2e_installed.sh

      - name: Run Windows installer E2E
        if: runner.os == 'Windows' && matrix.e2e_mode == 'installed'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_powershell_installer_e2e.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_windows_launcher.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_windows_cli_dispatch.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-posix:
    name: Build & Attest POSIX Artifacts
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20.19.4'
          cache: npm
          package-manager-cache: false

      - name: Determine version and tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Render release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.vars.outputs.tag }}"
          base_url="https://github.com/${{ github.repository }}/releases/download/$tag"
          bash scripts/render_release.sh "$tag" "$base_url" dist-release

      - name: Attest POSIX build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist-release/gitsetu
            dist-release/gitsetu.manifest.json
            dist-release/install.sh
            dist-release/uninstall.sh
            dist-release/SHA256SUMS

      - name: Upload POSIX artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: posix-artifacts
          path: dist-release

  publish-release:
    name: Publish GitHub Release
    needs: build-posix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - name: Download POSIX artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: posix-artifacts
          path: dist-release

      - name: Regenerate Unified SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist-release
          assets=()
          for f in gitsetu gitsetu.manifest.json install.sh uninstall.sh; do
            [[ -f "$f" ]] && assets+=("$f")
          done
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build-posix.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist-release
          extra_flags=()
          if [[ "$TAG" == *"-"* ]]; then
            extra_flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            gitsetu \
            gitsetu.manifest.json \
            install.sh \
            uninstall.sh \
            SHA256SUMS \
            --title "GitSetu $TAG" \
            --generate-notes \
            "${extra_flags[@]+"${extra_flags[@]}"}"

  smoke-install:
    name: Install the published release (${{ matrix.os }})
    needs: [build-posix, publish-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: README one-line install, then the installed version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-posix.outputs.tag }}
          VERSION: ${{ needs.build-posix.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$TAG/install.sh" | bash
          "$HOME/.local/bin/gitsetu" --version | grep -Fx "gitsetu v$VERSION"

  publish-npm:
    name: Publish npm Package
    needs: [publish-release, build-posix, smoke-install]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20.19.4'
          cache: npm
          package-manager-cache: false

      - name: Publish to npm (if NPM_TOKEN present)
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG_VER: ${{ needs.build-posix.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            node -e 'const fs=require("fs"); const pkg=JSON.parse(fs.readFileSync("package.json","utf8")); pkg.private=false; pkg.version=process.env.TAG_VER; pkg.description="Run several Git identities on one machine, safely."; pkg.gitsetuRelease.state="released"; fs.writeFileSync("package.json", JSON.stringify(pkg,null,2)+"\n");'
            sed -e "s|^GITSETU_VERSION=.*|GITSETU_VERSION=\"$TAG_VER\"|" lib/core.sh > lib/core.sh.tmp && mv -f lib/core.sh.tmp lib/core.sh
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            if [[ "$TAG_VER" == *"-"* ]]; then
              npm publish --access public --provenance --tag next
            else
              npm publish --access public --provenance
            fi
          else
            echo "NPM_TOKEN secret not configured; skipping npm publish."
          fi
